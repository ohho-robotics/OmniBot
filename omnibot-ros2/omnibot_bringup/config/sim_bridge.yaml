# ROS topics sim.launch.py exposes for a later rosbridge client (OHH-92).
# This file does not start rosbridge_server. The smoke test does not need it.
#
#   /cmd_vel                     geometry_msgs/msg/Twist       (ROS -> GZ, drives the base)
#   /odom                        nav_msgs/msg/Odometry
#   /scan                        sensor_msgs/msg/LaserScan
#   /imu                         sensor_msgs/msg/Imu           (GZ /imu/data)
#   /camera/front/image_raw      sensor_msgs/msg/Image
#   /camera/front/camera_info    sensor_msgs/msg/CameraInfo
#   /clock                       rosgraph_msgs/msg/Clock
---
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu"
  gz_topic_name: "/imu/data"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/front/image_raw"
  gz_topic_name: "/camera/front/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/front/camera_info"
  gz_topic_name: "/camera/front/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
