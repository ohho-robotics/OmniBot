name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    name: CPU tests and ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: README CPU commands
        run: python3 scripts/check_readme_commands.py --section cpu
      - name: Ruff
        run: |
          .venv/bin/python -m pip install ruff
          .venv/bin/ruff check .

  ros:
    name: colcon build and test
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base-noble
    timeout-minutes: 120
    steps:
      - name: Install git and sudo
        run: apt-get update && apt-get install -y git sudo ca-certificates
      - uses: actions/checkout@v4
      - name: README ROS commands
        shell: bash
        run: python3 scripts/check_readme_commands.py --section ros
